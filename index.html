<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>為食兵團供應商名錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: 'f1f597ac7460d64effc41bf06094a83e' };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=2fdab96ce1fd72c805a9ac50e3da5422&plugin=AMap.AutoComplete,AMap.PlaceSearch"></script>
    <style> 
        #map { height: 450px; width: 100%; border-radius: 0.75rem; } 
        .amap-sug-result { z-index: 9999 !important; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .star-item { display: inline-block; position: relative; cursor: pointer; font-size: 2rem; user-select: none; }
        .star-item .half-left { position: absolute; left: 0; width: 50%; height: 100%; z-index: 2; }
        .star-item .half-right { position: absolute; right: 0; width: 50%; height: 100%; z-index: 2; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- 登入 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-6">
            <div class="text-center">
                <span class="text-4xl">🛡️</span>
                <h2 class="text-2xl font-bold mt-2 text-slate-900">為食兵團供應商名錄</h2>
                <p class="text-sm text-slate-500 mt-1">請選擇您的兵團身份並輸入 PIN 碼</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">選擇帳戶</label>
                    <select id="login-user" class="mt-1 block w-full rounded-lg border border-slate-300 p-2.5 bg-slate-50">
                        <option value="">載入中...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">安全 PIN 碼</label>
                    <input type="password" id="login-pin" placeholder="請輸入 PIN 碼" class="mt-1 block w-full rounded-lg border border-slate-300 p-2.5 bg-slate-50">
                </div>
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">進入兵團基地</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- 主介面 -->
    <div id="app-container" class="max-w-4xl mx-auto p-4 pb-24 hidden">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-100">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2"><span>🛡️</span> 為食兵團供應商名錄</h1>
                <p class="text-xs text-slate-500 mt-0.5">當前身份：<span id="current-role-badge" class="font-semibold text-amber-600"></span></p>
            </div>
            <button onclick="location.reload()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg">切換身份</button>
        </header>

        <div class="flex bg-slate-200/70 p-1 rounded-xl mb-6">
            <button onclick="switchTab('list')" id="tab-list-btn" class="flex-1 py-2 rounded-lg text-sm font-medium bg-white text-slate-900 shadow-sm">📋 餐廳清單</button>
            <button onclick="switchTab('add')" id="tab-add-btn" class="flex-1 py-2 rounded-lg text-sm font-medium text-slate-600">➕ 新增餐廳</button>
            <button onclick="switchTab('map')" id="tab-map-btn" class="flex-1 py-2 rounded-lg text-sm font-medium text-slate-600">🗺️ 美食地圖</button>
        </div>

        <!-- 餐廳清單頁 -->
        <div id="section-list" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 md:grid-cols-5 gap-2">
                <select id="filter-city" onchange="renderList()" class="rounded-lg border p-2 text-sm bg-slate-50">
                    <option value="">全部城市</option>
                    <option value="澳門">澳門</option>
                    <option value="珠海">珠海</option>
                    <option value="中山">中山</option>
                    <option value="香港">香港</option>
                </select>
                <select id="filter-status" onchange="renderList()" class="rounded-lg border p-2 text-sm bg-slate-50">
                    <option value="">全部狀態</option>
                    <option value="待試">⏳ 待試名單</option>
                    <option value="已試過">✨ 已試過</option>
                </select>
                <select id="filter-sort" onchange="renderList()" class="rounded-lg border p-2 text-sm bg-slate-50">
                    <option value="latest">最新新增</option>
                    <option value="rating">評分最高</option>
                    <option value="visit">造訪次數</option>
                </select>
                <input type="text" id="filter-keyword" oninput="renderList()" placeholder="搜尋餐廳 / 招牌菜..." class="rounded-lg border p-2 text-sm bg-slate-50">
                <button onclick="triggerLottery()" class="bg-amber-500 hover:bg-amber-600 text-white text-sm rounded-lg py-2 transition">🎰 盲盒抽籤</button>
            </div>
            <div id="restaurant-cards" class="space-y-4"></div>
        </div>

        <!-- 新增餐廳頁 -->
        <div id="section-add" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hidden space-y-4">
            <h2 class="text-lg font-bold border-b pb-2">新增目標餐廳（高德自動定位）</h2>
            <form id="add-form" onsubmit="submitRestaurant(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium">餐廳名稱 * (輸入即自動聯想)</label>
                        <input type="text" id="input-name" required class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="例如：軟利麵家">
                    </div>
                    <div>
                        <label class="text-sm font-medium">城市</label>
                        <input type="text" id="input-city" list="city-list" value="澳門" class="w-full border p-2.5 rounded-lg text-sm mt-1 bg-slate-50">
                        <datalist id="city-list"><option value="澳門"><option value="珠海"><option value="中山"><option value="香港"></datalist>
                    </div>
                    <div>
                        <label class="text-sm font-medium">細分區域</label>
                        <input type="text" id="input-district" class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="例如：橫琴 / 鬥門">
                    </div>
                    <div>
                        <label class="text-sm font-medium">菜式種類</label>
                        <input type="text" id="input-type" class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="例如：麵食 / 葡國菜">
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium">特色 / 招牌推介</label>
                        <input type="text" id="input-specialty" class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="例如：麻婆豆腐、水蟹粥">
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium">詳細地址</label>
                        <input type="text" id="input-address" class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="詳細地址">
                    </div>
                    <div>
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium">營業時間 (開門)</label>
                            <label class="text-xs text-slate-500 flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" id="input-time-unknown" onchange="toggleHoursInput(this)"> 暫不設定/未明
                            </label>
                        </div>
                        <select id="input-time-start" class="w-full border p-2.5 rounded-lg text-sm mt-1 bg-slate-50">
                            <option value="07:00">07:00</option><option value="08:00">08:00</option><option value="09:00">09:00</option><option value="10:00" selected>10:00</option><option value="11:00">11:00</option><option value="12:00">12:00</option><option value="17:00">17:00</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">營業時間 (關門)</label>
                        <select id="input-time-end" class="w-full border p-2.5 rounded-lg text-sm mt-1 bg-slate-50">
                            <option value="21:00">21:00</option><option value="21:30">21:30</option><option value="22:00" selected>22:00</option><option value="22:30">22:30</option><option value="23:00">23:00</option><option value="00:00">00:00</option><option value="02:00">02:00</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">聯絡電話</label>
                        <input type="text" id="input-phone" class="w-full border p-2.5 rounded-lg text-sm mt-1" placeholder="聯絡電話">
                    </div>
                </div>
                <input type="hidden" id="input-lng">
                <input type="hidden" id="input-lat">
                <button type="submit" id="submit-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-3 rounded-xl transition shadow-md">確認新增並寫入雲端</button>
            </form>
        </div>

        <!-- 地圖頁 -->
        <div id="section-map" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 hidden space-y-3">
            <div id="map"></div>
        </div>
    </div>

    <!-- 評分 Modal -->
    <div id="rating-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold border-b pb-2">新增評分與記錄</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-medium">評分星級 (點擊左/右半邊選半星或滿星)</label>
                    <div class="flex items-center gap-1 mt-1" id="star-container">
                        <div class="star-item" id="star-1"><div class="half-left" onclick="setRating(0.5)"></div><div class="half-right" onclick="setRating(1.0)"></div><span class="star-icon">⭐</span></div>
                        <div class="star-item" id="star-2"><div class="half-left" onclick="setRating(1.5)"></div><div class="half-right" onclick="setRating(2.0)"></div><span class="star-icon">⭐</span></div>
                        <div class="star-item" id="star-3"><div class="half-left" onclick="setRating(2.5)"></div><div class="half-right" onclick="setRating(3.0)"></div><span class="star-icon">⭐</span></div>
                        <div class="star-item" id="star-4"><div class="half-left" onclick="setRating(3.5)"></div><div class="half-right" onclick="setRating(4.0)"></div><span class="star-icon">⭐</span></div>
                        <div class="star-item" id="star-5"><div class="half-left" onclick="setRating(4.5)"></div><div class="half-right" onclick="setRating(5.0)"></div><span class="star-icon">⭐</span></div>
                        <span id="rating-text" class="text-base font-bold ml-2 text-amber-600">5.0 星</span>
                    </div>
                    <input type="hidden" id="rating-score" value="5">
                </div>
                <div>
                    <label class="text-xs font-medium">用餐短評</label>
                    <textarea id="rating-comment" class="w-full border p-2 rounded text-sm mt-1" placeholder="寫下食後感..."></textarea>
                </div>
                <div>
                    <label class="text-xs font-medium">上傳當次相片 (高清原圖，可多選)</label>
                    <input type="file" accept="image/*" multiple class="w-full border p-1.5 rounded text-xs mt-1 bg-slate-50" onchange="handleRatingPhotos(this)">
                    <div id="rating-photo-preview" class="grid grid-cols-4 gap-2 mt-2"></div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button id="rating-submit-btn" onclick="submitRating()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-sm">提交評分</button>
                    <button onclick="document.getElementById('rating-modal').classList.add('hidden')" class="bg-slate-200 px-4 py-2 rounded-lg text-sm">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 歷史評分 Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="history-title" class="text-lg font-bold">歷史評分記錄</h3>
                <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <div id="history-content" class="space-y-3 max-h-64 overflow-y-auto"></div>
        </div>
    </div>

    <!-- 圖片放大預覽燈箱 Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4 hidden" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-full">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white text-3xl font-bold">&times;</button>
            <img id="modal-img" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
        </div>
    </div>

    <!-- 抽籤 Modal -->
    <div id="lottery-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
            <span class="text-5xl block text-center">🎰</span>
            <h3 class="text-xl font-bold text-center border-b pb-2">今日盲盒抽中</h3>
            <div id="lottery-result" class="space-y-2 text-sm"></div>
            <button onclick="document.getElementById('lottery-modal').classList.add('hidden')" class="w-full bg-slate-800 text-white py-2.5 rounded-xl">收到！</button>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbydk9NCtPJwIuPGFGQm5smpaRd-vbr_i-a1CUO9M9VumDqSiEp1LKhHfWDidikoLs-6/exec';

        let currentUser = null;
        let currentRole = 'member';
        let restaurantsData = [];
        let currentRatingRestId = null;
        let ratingPhotosBase64 = [];
        let commentPhotoBase64 = {};

        const simToTradMap = {
            '广':'廣','东':'東','区':'區','湾':'灣','门':'門','饭':'飯','店':'店','记':'記','饺':'餃','面':'麵','鲜':'鮮','鱼':'魚','肉':'肉','鸡':'雞',
            '厅':'廳','铺':'鋪','马':'馬','场':'場','国':'國','华':'華','宝':'寶','龙':'龍','风':'風','车':'車','书':'書','红':'紅','绿':'綠',
            '花地玛堂区':'花地瑪堂區','圣安多尼堂区':'聖安多尼堂區','大堂区':'大堂區','望德堂区':'望德堂區','风顺堂区':'風順堂區',
            '嘉模堂区':'嘉模堂區','路凼填海区':'路氹填海區','圣方济各堂区':'聖方濟各堂區','斗门':'鬥門','香洲区':'香洲區','横琴':'橫琴'
        };

        function toTraditional(text) {
            if (!text) return '';
            let res = text;
            for (let sim in simToTradMap) {
                res = res.replace(new RegExp(sim, 'g'), simToTradMap[sim]);
            }
            return res;
        }

        window.onload = function() {
            fetch(`${GAS_URL}?action=getUsers`)
            .then(res => res.json())
            .then(res => {
                const select = document.getElementById('login-user');
                if (res.status === 'success' && res.users.length > 0) {
                    select.innerHTML = res.users.map(u => `<option value="${u.username}">${u.username} (${u.role})</option>`).join('');
                }
            });
        };

        function handleLogin() {
            const user = document.getElementById('login-user').value;
            const pin = document.getElementById('login-pin').value;
            fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(user)}&pin=${encodeURIComponent(pin)}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    currentUser = res.username;
                    currentRole = res.role.toLowerCase();
                    document.getElementById('current-role-badge').innerText = `${currentUser} (${currentRole})`;
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    loadData();
                    initAmapAutocomplete();
                } else { alert(res.message || 'PIN 碼錯誤'); }
            });
        }

        function initAmapAutocomplete() {
            if (typeof AMap === 'undefined') return;
            AMap.plugin(['AMap.AutoComplete'], function() {
                var auto = new AMap.AutoComplete({ input: "input-name" });
                auto.on("select", function(e) {
                    if (e.poi) {
                        document.getElementById('input-name').value = toTraditional(e.poi.name || '');
                        document.getElementById('input-address').value = toTraditional(e.poi.address || '');
                        document.getElementById('input-phone').value = e.poi.tel || '';
                        if (e.poi.location) {
                            document.getElementById('input-lng').value = e.poi.location.lng;
                            document.getElementById('input-lat').value = e.poi.location.lat;
                        }
                        if (e.poi.district) {
                            let dist = toTraditional(e.poi.district);
                            document.getElementById('input-district').value = dist;
                            if (dist.includes('珠海')) document.getElementById('input-city').value = '珠海';
                            else if (dist.includes('中山')) document.getElementById('input-city').value = '中山';
                            else if (dist.includes('香港')) document.getElementById('input-city').value = '香港';
                            else document.getElementById('input-city').value = '澳門';
                        }
                    }
                });
            });
        }

        function toggleHoursInput(cb) {
            const start = document.getElementById('input-time-start');
            const end = document.getElementById('input-time-end');
            start.disabled = cb.checked;
            end.disabled = cb.checked;
            if(cb.checked) {
                start.classList.add('opacity-50');
                end.classList.add('opacity-50');
            } else {
                start.classList.remove('opacity-50');
                end.classList.remove('opacity-50');
            }
        }

        function switchTab(tab) {
            ['list', 'add', 'map'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "flex-1 py-2 rounded-lg text-sm font-medium text-slate-600";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "flex-1 py-2 rounded-lg text-sm font-medium bg-white text-slate-900 shadow-sm";
            if(tab === 'map') initAmap();
        }

        function loadData() {
            fetch(`${GAS_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    restaurantsData = res.data;
                    renderList();
                }
            });
        }

        function renderList() {
            const cityFilter = document.getElementById('filter-city').value;
            const statusFilter = document.getElementById('filter-status').value;
            const sortType = document.getElementById('filter-sort').value;
            const keyword = document.getElementById('filter-keyword').value.toLowerCase();
            const container = document.getElementById('restaurant-cards');

            let filtered = restaurantsData.filter(item => {
                const matchCity = !cityFilter || item.city === cityFilter;
                const matchStatus = !statusFilter || item.status === statusFilter;
                const matchKw = !keyword || (item.name && item.name.toLowerCase().includes(keyword)) || (item.specialty && item.specialty.toLowerCase().includes(keyword));
                return matchCity && matchStatus && matchKw;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 bg-white rounded-2xl border border-slate-100">暫無符合條件的餐廳</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isVisited = item.status === '已試過';
                const donaldLatest = getLatestRating(item, 'Donald');
                const agnesLatest = getLatestRating(item, 'Agnes');
                const photoCount = (item.photos || []).length;
                const amapNavUrl = (item.lng && item.lat) 
                    ? `https://uri.amap.com/marker?position=${item.lng},${item.lat}&name=${encodeURIComponent(item.name)}&coordinate=gaode`
                    : `https://uri.amap.com/search?keyword=${encodeURIComponent(item.name)}`;

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">${toTraditional(item.city) || '澳門'} · ${toTraditional(item.district) || '未分類'}</span>
                                <h3 class="text-lg font-bold mt-1">${toTraditional(item.name)}</h3>
                                <p class="text-xs text-slate-500">${toTraditional(item.type) || '美食'} | 📞 ${item.phone || '無'} | 🕒 ${item.hours || '未明'}</p>
                                ${item.specialty ? `<p class="text-xs text-amber-700 font-medium mt-1">🔥 招牌/特色：${toTraditional(item.specialty)}</p>` : ''}
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full ${isVisited ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100'}">${item.status || '待試'} ${isVisited ? `(${item.visit_count || 1}次)` : ''}</span>
                        </div>
                        
                        <p class="text-sm text-slate-600 bg-slate-50 p-2.5 rounded-xl">📍 ${toTraditional(item.address) || '無地址'}</p>

                        ${photoCount > 0 ? `
                            <div>
                                <button onclick="togglePhotos('${item.id}')" class="text-xs text-amber-700 font-semibold bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 hover:bg-amber-100 transition">
                                    📸 睇相片 (${photoCount}張) <span id="photo-arrow-${item.id}">▼</span>
                                </button>
                                <div id="photo-gallery-${item.id}" class="grid grid-cols-3 gap-2 mt-2 hidden">
                                    ${item.photos.map(p => `<img src="${p}" onclick="openImageModal('${p}')" class="w-full h-24 object-cover rounded-lg border cursor-pointer hover:opacity-90 transition">`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="grid grid-cols-2 gap-3 pt-2 border-t text-xs">
                            <div class="bg-amber-50 p-3 rounded-xl border border-amber-100 space-y-1 cursor-pointer hover:bg-amber-100 transition" onclick="showHistory('${item.id}', 'Donald')">
                                <div class="font-bold text-amber-900 flex justify-between"><span>🛡️ 總司令 (Donald)</span><span>⭐ ${donaldLatest.rating}/5</span></div>
                                <p class="text-slate-600 italic">"${donaldLatest.comment}"</p>
                                <div class="text-[10px] text-amber-700 text-right">點擊查看歷史 (${donaldLatest.count}次)</div>
                            </div>
                            <div class="bg-rose-50 p-3 rounded-xl border border-rose-100 space-y-1 cursor-pointer hover:bg-rose-100 transition" onclick="showHistory('${item.id}', 'Agnes')">
                                <div class="font-bold text-rose-900 flex justify-between"><span>👑 團長 (Agnes)</span><span>⭐ ${agnesLatest.rating}/5</span></div>
                                <p class="text-slate-600 italic">"${agnesLatest.comment}"</p>
                                <div class="text-[10px] text-rose-700 text-right">點擊查看歷史 (${agnesLatest.count}次)</div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl space-y-2 text-xs">
                            <div class="font-bold text-slate-700">💬 兵團成員交流區</div>
                            <div class="space-y-1 max-h-40 overflow-y-auto">
                                ${(!item.comments || item.comments.length === 0) ? '<div class="text-slate-400">暫無留言，快來發表心得！</div>' : 
                                    item.comments.map(c => `
                                        <div class="bg-white p-2 rounded border border-slate-100 space-y-1">
                                            <div class="flex justify-between"><span class="font-semibold text-amber-800">${c.user}</span><span class="text-[9px] text-slate-400">${c.time}</span></div>
                                            <div>${c.text}</div>${c.photo ? `<img src="${c.photo}" onclick="openImageModal('${c.photo}')" class="w-20 h-20 object-cover rounded mt-1 border cursor-pointer hover:opacity-90 transition">` : ''}
                                        </div>
                                    `).join('')
                                }
                            </div>
                            <div class="space-y-1 pt-1">
                                <div class="flex gap-2">
                                    <input type="text" id="comment-input-${item.id}" placeholder="寫下您的心得..." class="flex-1 border rounded px-2 py-1 bg-white">
                                    <button onclick="postComment('${item.id}')" class="bg-slate-800 text-white px-3 py-1 rounded">發布</button>
                                </div>
                                <div class="flex items-center gap-2 text-[10px] text-slate-500">
                                    <span>附加相片:</span>
                                    <input type="file" accept="image/*" class="text-[10px]" onchange="encodeCommentImage('${item.id}', this)">
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2 flex-wrap">
                            <a href="${amapNavUrl}" target="_blank" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs transition">🗺️ 高德導航</a>
                            <button onclick="openRatingModal('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs transition">✨ 標記已試過 / 新增評分</button>
                            ${currentRole === 'admin' ? `<button onclick="deleteRestaurant('${item.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs transition">🗑️ 刪除 (Admin)</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function togglePhotos(id) {
            const gallery = document.getElementById(`photo-gallery-${id}`);
            const arrow = document.getElementById(`photo-arrow-${id}`);
            if (gallery.classList.contains('hidden')) {
                gallery.classList.remove('hidden');
                arrow.innerText = '▲';
            } else {
                gallery.classList.add('hidden');
                arrow.innerText = '▼';
            }
        }

        function openImageModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function getLatestRating(item, targetUser) {
            if (!item.ratings || !Array.isArray(item.ratings)) return { rating: 0, comment: '暫無短評', count: 0 };
            const userRatings = item.ratings.filter(r => r.user === targetUser);
            if (userRatings.length === 0) return { rating: 0, comment: '暫無短評', count: 0 };
            const latest = userRatings[userRatings.length - 1];
            return { rating: latest.rating, comment: latest.comment, count: userRatings.length };
        }

        function showHistory(id, targetUser) {
            const item = restaurantsData.find(i => i.id === id);
            if (!item || !item.ratings) return;
            const userRatings = item.ratings.filter(r => r.user === targetUser);
            
            document.getElementById('history-title').innerText = `${targetUser} 的歷史評分記錄 (${toTraditional(item.name)})`;
            const content = document.getElementById('history-content');
            
            if (userRatings.length === 0) {
                content.innerHTML = `<div class="text-slate-400 text-center py-4">尚無歷史評分記錄</div>`;
            } else {
                content.innerHTML = userRatings.reverse().map(r => `
                    <div class="bg-slate-50 p-3 rounded-xl border space-y-1">
                        <div class="flex justify-between font-bold text-xs"><span>⭐ ${r.rating}/5 星</span><span class="text-slate-400 text-[10px]">${r.time}</span></div>
                        <p class="text-xs text-slate-700 italic">"${r.comment}"</p>
                    </div>
                `).join('');
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function submitRestaurant(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.innerText = '寫入雲端中...';

            const isUnknownHours = document.getElementById('input-time-unknown').checked;
            const timeStart = document.getElementById('input-time-start').value;
            const timeEnd = document.getElementById('input-time-end').value;

            const payload = {
                action: 'addRestaurant',
                name: document.getElementById('input-name').value,
                city: document.getElementById('input-city').value,
                district: document.getElementById('input-district').value,
                type: document.getElementById('input-type').value,
                specialty: document.getElementById('input-specialty').value,
                address: document.getElementById('input-address').value,
                hours: isUnknownHours ? '未明' : `${timeStart}-${timeEnd}`,
                phone: document.getElementById('input-phone').value,
                lng: document.getElementById('input-lng').value,
                lat: document.getElementById('input-lat').value,
                created_by: currentUser
            };

            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(() => {
                alert('成功加入兵團名錄！');
                document.getElementById('add-form').reset();
                toggleHoursInput({ checked: false });
                btn.disabled = false;
                btn.innerText = '確認新增並寫入雲端';
                switchTab('list');
                loadData();
            }).catch(() => {
                btn.disabled = false;
                btn.innerText = '確認新增並寫入雲端';
            });
        }

        function openRatingModal(id) {
            currentRatingRestId = id;
            ratingPhotosBase64 = [];
            setRating(5.0);
            document.getElementById('rating-comment').value = '';
            document.getElementById('rating-photo-preview').innerHTML = '';
            document.getElementById('rating-modal').classList.remove('hidden');
        }

        function setRating(val) {
            document.getElementById('rating-score').value = val;
            document.getElementById('rating-text').innerText = `${val.toFixed(1)} 星`;
            for (let i = 1; i <= 5; i++) {
                const starEl = document.querySelector(`#star-${i} .star-icon`);
                starEl.style.opacity = val >= i ? '1' : '0.2';
            }
        }

        function handleRatingPhotos(input) {
            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach(file => {
                    // 保留高清原圖，僅轉化為 Base64 傳送到 GAS 由 Drive 儲存
                    const reader = new FileReader();
                    reader.onload = e => {
                        ratingPhotosBase64.push(e.target.result);
                        renderRatingPhotoPreview();
                    };
                    reader.readAsDataURL(file);
                });
                input.value = '';
            }
        }

        function renderRatingPhotoPreview() {
            const preview = document.getElementById('rating-photo-preview');
            preview.innerHTML = ratingPhotosBase64.map((img, idx) => `
                <div class="relative group">
                    <img src="${img}" onclick="openImageModal('${img}')" class="w-full h-16 object-cover rounded-lg border cursor-pointer">
                    <button onclick="removeRatingPhoto(${idx})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow z-10">✕</button>
                </div>
            `).join('');
        }

        function removeRatingPhoto(index) {
            ratingPhotosBase64.splice(index, 1);
            renderRatingPhotoPreview();
        }

        function encodeCommentImage(id, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    commentPhotoBase64[id] = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function submitRating() {
            const btn = document.getElementById('rating-submit-btn');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.innerText = '上傳高清原圖至 Drive 中...';

            const item = restaurantsData.find(i => i.id === currentRatingRestId);
            const score = parseFloat(document.getElementById('rating-score').value);
            const comment = document.getElementById('rating-comment').value;

            const payload = {
                action: 'updateRestaurant',
                id: currentRatingRestId,
                status: '已試過',
                visit_count: (item ? item.visit_count || 0 : 0) + 1,
                new_rating: { user: currentUser, rating: score, comment: comment, time: new Date().toLocaleString() },
                new_photos: ratingPhotosBase64
            };

            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.innerText = '提交評分';
                if(res.status === 'success') {
                    alert('高清原圖已成功存入 Google Drive！');
                    document.getElementById('rating-modal').classList.add('hidden');
                    loadData();
                } else {
                    alert('提交失敗：' + res.message);
                }
            }).catch(() => {
                btn.disabled = false;
                btn.innerText = '提交評分';
                alert('網絡連線失敗');
            });
        }

        function postComment(id) {
            const text = document.getElementById(`comment-input-${id}`).value.trim();
            if(!text) return;

            const payload = { action: 'addComment', id: id, user: currentUser, text: text, photo: commentPhotoBase64[id] || '' };
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(() => { commentPhotoBase64[id] = ''; loadData(); });
        }

        function deleteRestaurant(id) {
            if(!confirm('確定要永久刪除這間餐廳嗎？')) return;
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteRestaurant', id: id }) })
            .then(() => { alert('已成功刪除'); loadData(); });
        }

        function triggerLottery() {
            const pending = restaurantsData.filter(i => i.status === '待試');
            if(pending.length === 0) { alert('暫無待試餐廳！'); return; }
            const pick = pending[Math.floor(Math.random() * pending.length)];
            
            document.getElementById('lottery-result').innerHTML = `
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 text-amber-900 space-y-2">
                    <div class="font-bold text-lg text-amber-800">${toTraditional(pick.name)}</div>
                    <div>📍 <b>地址：</b>${toTraditional(pick.address) || '無'}</div>
                    <div>🏙️ <b>城市/區域：</b>${toTraditional(pick.city)} · ${toTraditional(pick.district) || '未分類'}</div>
                    <div>🍲 <b>菜式種類：</b>${toTraditional(pick.type) || '未填'}</div>
                    ${pick.specialty ? `<div>🔥 <b>招牌推介：</b>${toTraditional(pick.specialty)}</div>` : ''}
                    <div>🕒 <b>營業時間：</b>${pick.hours || '未明'}</div>
                    <div>📞 <b>聯絡電話：</b>${pick.phone || '無'}</div>
                </div>
            `;
            document.getElementById('lottery-modal').classList.add('hidden');
        }

        function initAmap() {
            if (!window.amapObj) {
                window.amapObj = new AMap.Map('map', { zoom: 13, center: [113.543, 22.198] });
            }
            window.amapObj.clearMap();
            restaurantsData.forEach(item => {
                if (item.lng && item.lat) {
                    var marker = new AMap.Marker({ position: [parseFloat(item.lng), parseFloat(item.lat)], title: toTraditional(item.name) });
                    marker.on('click', function() {
                        var infoWindow = new AMap.InfoWindow({
                            content: `<div style="padding:5px;"><b>${toTraditional(item.name)}</b><br>${toTraditional(item.address) || ''}<br><a href="https://uri.amap.com/marker?position=${item.lng},${item.lat}&name=${encodeURIComponent(item.name)}&coordinate=gaode" target="_blank" style="color:#2563eb;">高德導航</a></div>`,
                            offset: new AMap.Pixel(0, -30)
                        });
                        infoWindow.open(window.amapObj, marker.getPosition());
                    });
                    window.amapObj.add(marker);
                }
            });
        }
    </script>
</body>
</html>
