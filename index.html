    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbydk9NCtPJwIuPGFGQm5smpaRd-vbr_i-a1CUO9M9VumDqSiEp1LKhHfWDidikoLs-6/exec';
        const IMGBB_API_KEY = '26fadf42e38a262ad63b2987ed673889';

        let currentUser = null;
        let currentRole = 'member';
        let restaurantsData = [];
        let currentRatingRestId = null;
        let ratingPhotosBase64 = []; 
        let commentPhotosMap = {};   

        const simToTradMap = {
            '广':'廣','东':'東','区':'區','湾':'灣','门':'門','饭':'飯','店':'店','记':'記','饺':'餃','面':'麵','鲜':'鮮','鱼':'魚','肉':'肉','鸡':'雞',
            '厅':'廳','铺':'鋪','马':'馬','场':'場','国':'國','华':'華','宝':'寶','龙':'龍','风':'風','车':'車','书':'書','红':'紅','绿':'綠',
            '花地玛堂区':'花地瑪堂區','圣安多尼堂区':'聖安多尼堂區','大堂区':'大堂區','望德堂区':'望德堂區','风顺堂区':'風順堂區',
            '嘉模堂区':'嘉模堂區','路凼填海区':'路氹填海區','圣方济各堂区':'聖方濟各堂區','斗门':'鬥門','香洲区':'香洲區','横琴':'橫琴'
        };

        function toTraditional(text) {
            if (!text) return '';
            let res = text;
            for (let sim in simToTradMap) {
                res = res.replace(new RegExp(sim, 'g'), simToTradMap[sim]);
            }
            return res;
        }

        function postForm(payloadObj) {
            return fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payloadObj)
            }).then(r => r.json());
        }

        function compressFile(file, callback) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 1000;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX || height > MAX) {
                        if (width > height) {
                            height = Math.round(height * (MAX / width));
                            width = MAX;
                        } else {
                            width = Math.round(width * (MAX / height));
                            height = MAX;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function uploadBase64ToImgBB(base64Data) {
            const pureBase64 = base64Data.replace(/^data:image\/\w+;base64,/, '');
            const formData = new FormData();
            formData.append("image", pureBase64);

            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            if (data && data.success) {
                return data.data.url;
            } else {
                throw new Error(data.error?.message || "ImgBB 上傳失敗");
            }
        }

        window.onload = function() {
            fetch(`${GAS_URL}?action=getUsers`)
            .then(res => res.json())
            .then(res => {
                const select = document.getElementById('login-user');
                if (res.status === 'success' && res.users.length > 0) {
                    select.innerHTML = res.users.map(u => `<option value="${u.username}">${u.username} (${u.role})</option>`).join('');
                }
            });
        };

        function handleLogin() {
            const user = document.getElementById('login-user').value;
            const pin = document.getElementById('login-pin').value;
            fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(user)}&pin=${encodeURIComponent(pin)}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    currentUser = res.username;
                    currentRole = res.role.toLowerCase();
                    document.getElementById('current-role-badge').innerText = `${currentUser} (${currentRole})`;
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    loadData();
                    initAmapAutocomplete();
                } else { alert(res.message || 'PIN 碼錯誤'); }
            });
        }

        // 高德 AutoComplete 精準帶入完整地址與經緯度
        function initAmapAutocomplete() {
            if (typeof AMap === 'undefined') return;
            AMap.plugin(['AMap.AutoComplete'], function() {
                var auto = new AMap.AutoComplete({ input: "input-name" });

                auto.on("select", function(e) {
                    if (e.poi) {
                        document.getElementById('input-name').value = toTraditional(e.poi.name || '');
                        
                        // 確保地址完整 (結合 address 與 district)
                        let fullAddr = e.poi.address || '';
                        if (typeof fullAddr === 'object') fullAddr = fullAddr.toString();
                        document.getElementById('input-address').value = toTraditional(fullAddr);

                        if (e.poi.location) {
                            document.getElementById('input-lng').value = e.poi.location.lng;
                            document.getElementById('input-lat').value = e.poi.location.lat;
                        }
                        if (e.poi.district) {
                            let dist = toTraditional(e.poi.district);
                            document.getElementById('input-district').value = dist;
                            if (dist.includes('珠海')) document.getElementById('input-city').value = '珠海';
                            else if (dist.includes('中山')) document.getElementById('input-city').value = '中山';
                            else if (dist.includes('香港')) document.getElementById('input-city').value = '香港';
                            else document.getElementById('input-city').value = '澳門';
                        }
                    }
                });
            });
        }

        function switchTab(tab) {
            ['list', 'add', 'map'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "flex-1 py-2 rounded-lg text-sm font-medium text-slate-600";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "flex-1 py-2 rounded-lg text-sm font-medium bg-white text-slate-900 shadow-sm";
            if(tab === 'map') initAmap();
        }

        function loadData() {
            fetch(`${GAS_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    restaurantsData = res.data;
                    renderList();
                }
            });
        }

        function renderList() {
            const cityFilter = document.getElementById('filter-city').value;
            const statusFilter = document.getElementById('filter-status').value;
            const sortType = document.getElementById('filter-sort').value;
            const keyword = document.getElementById('filter-keyword').value.toLowerCase();
            const container = document.getElementById('restaurant-cards');

            let filtered = restaurantsData.filter(item => {

                                <div class="font-bold text-rose-900 flex justify-between"><span>👑 團長 (Agnes)</span><span>⭐ ${agnesLatest.rating}/5</span></div>
                                <p class="text-slate-600 italic">"${agnesLatest.comment}"</p>
                                <div class="text-[10px] text-rose-700 text-right">點擊查看歷史 (${agnesLatest.count}次)</div>
                            </div>

                        <!-- 交流區 -->

                                                    <span class="font-semibold text-amber-800">${c.user}</span>

                                                        ${canEdit ? `<button onclick="deleteComment('${item.id}', '${c.id}')" class="text-red-500 hover:text-red-700 text-[10px] font-bold">🗑️</button>` : ''}

                                                    <div class="grid grid-cols-4 gap-1 mt-1">

                                    <button id="comment-btn-${item.id}" onclick="postComment('${item.id}')" class="bg-slate-800 text-white px-3 py-1 rounded">發布</button>

                                        <input type="file" accept="image/*" multiple class="text-[10px]" onchange="handleCommentPhotos('${item.id}', this)">

                            ${currentRole === 'admin' ? `<button onclick="openEditRestModal('${item.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-xs transition">✏️ 編輯餐廳 (Admin)</button>` : ''}

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function togglePhotos(id) {
            const gallery = document.getElementById(`photo-gallery-${id}`);
            const arrow = document.getElementById(`photo-arrow-${id}`);
            if (gallery.classList.contains('hidden')) {
                gallery.classList.remove('hidden');
                arrow.innerText = '▲';
            } else {
                gallery.classList.add('hidden');
                arrow.innerText = '▼';
            }
        }

        function openImageModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function getLatestRating(item, targetUser) {
            if (!item.ratings || !Array.isArray(item.ratings)) return { rating: 0, comment: '暫無短評', count: 0 };
            const userRatings = item.ratings.filter(r => r.user === targetUser);
            if (userRatings.length === 0) return { rating: 0, comment: '暫無短評', count: 0 };
            const latest = userRatings[userRatings.length - 1];
            return { rating: latest.rating, comment: latest.comment, count: userRatings.length };
        }

        function showHistory(id, targetUser) {
            const item = restaurantsData.find(i => i.id === id);
            if (!item || !item.ratings) return;
            const userRatings = item.ratings.filter(r => r.user === targetUser);
            
            document.getElementById('history-title').innerText = `${targetUser} 的歷史評分記錄 (${toTraditional(item.name)})`;
            const content = document.getElementById('history-content');
            
            if (userRatings.length === 0) {
                content.innerHTML = `<div class="text-slate-400 text-center py-4">尚無歷史評分記錄</div>`;
            } else {
                content.innerHTML = userRatings.reverse().map(r => {
                    const canEdit = (r.user === currentUser || currentRole === 'admin');
                    return `
                        <div class="bg-slate-50 p-3 rounded-xl border space-y-1">
                            <div class="flex justify-between items-center font-bold text-xs">
                                <span>⭐ ${r.rating}/5 星</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-slate-400 text-[10px]">${r.time}</span>
                                    ${canEdit ? `<button onclick="editRatingPrompt('${item.id}', '${r.id}', ${r.rating}, '${escapeQuotes(r.comment)}')" class="text-blue-500 hover:text-blue-700 text-[10px] font-bold">✏️ 編輯</button>` : ''}
                                    ${canEdit ? `<button onclick="deleteRating('${item.id}', '${r.id}')" class="text-red-500 hover:text-red-700 text-[10px] font-bold">🗑️ 刪除</button>` : ''}
                                </div>
                            </div>
                            <p class="text-xs text-slate-700 italic">"${r.comment}"</p>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function openEditRestModal(id) {
            const item = restaurantsData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('edit-rest-id').value = item.id;
            document.getElementById('edit-rest-name').value = item.name || '';
            document.getElementById('edit-rest-city').value = item.city || '';
            document.getElementById('edit-rest-district').value = item.district || '';
            document.getElementById('edit-rest-type').value = item.type || '';
            document.getElementById('edit-rest-phone').value = item.phone || '';
            document.getElementById('edit-rest-specialty').value = item.specialty || '';
            document.getElementById('edit-rest-address').value = item.address || '';
            document.getElementById('edit-rest-hours').value = item.hours || '';

            document.getElementById('edit-rest-modal').classList.remove('hidden');
        }

        function saveEditRestaurant() {
            const btn = document.getElementById('edit-rest-save-btn');
            btn.disabled = true;
            btn.innerText = '儲存中...';

            const payload = {
                action: 'editRestaurant',
                id: document.getElementById('edit-rest-id').value,
                name: document.getElementById('edit-rest-name').value,
                city: document.getElementById('edit-rest-city').value,
                district: document.getElementById('edit-rest-district').value,
                type: document.getElementById('edit-rest-type').value,
                phone: document.getElementById('edit-rest-phone').value,
                specialty: document.getElementById('edit-rest-specialty').value,
                address: document.getElementById('edit-rest-address').value,
                hours: document.getElementById('edit-rest-hours').value
            };

            postForm(payload).then(res => {
                if (res.status === 'success') {
                    alert('餐廳資料修訂成功！');
                    document.getElementById('edit-rest-modal').classList.add('hidden');
                    loadData();
                } else { alert('修改失敗：' + res.message); }
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = '儲存修改';
            });
        }

        function submitRestaurant(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.innerText = '寫入雲端中...';

            const payload = {
                action: 'addRestaurant',
                name: document.getElementById('input-name').value,
                city: document.getElementById('input-city').value,
                district: document.getElementById('input-district').value,
                type: document.getElementById('input-type').value,
                specialty: document.getElementById('input-specialty').value,
                address: document.getElementById('input-address').value,
                hours: document.getElementById('input-hours').value || '未明',
                phone: document.getElementById('input-phone').value || '無',
                lng: document.getElementById('input-lng').value,
                lat: document.getElementById('input-lat').value,
                created_by: currentUser
            };

            postForm(payload).then(() => {
                alert('成功加入兵團名錄！');
                document.getElementById('add-form').reset();
                btn.disabled = false;
                btn.innerText = '確認新增並寫入雲端';
                switchTab('list');
                loadData();
            }).catch(() => {
                btn.disabled = false;
                btn.innerText = '確認新增並寫入雲端';
            });

        function openRatingModal(id) {
            currentRatingRestId = id;
            ratingPhotosBase64 = [];
            setRating(5.0);
            document.getElementById('rating-comment').value = '';
            document.getElementById('rating-photo-preview').innerHTML = '';
            document.getElementById('rating-file-input').value = '';
            document.getElementById('rating-modal').classList.remove('hidden');
        }

        function setRating(val) {
            document.getElementById('rating-score').value = val;
            document.getElementById('rating-text').innerText = `${val.toFixed(1)} 星`;
            for (let i = 1; i <= 5; i++) {
                const starEl = document.querySelector(`#star-${i} .star-icon`);
                starEl.style.opacity = val >= i ? '1' : '0.2';
            }
        }

        function handleRatingPhotos(input) {
            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach(file => {
                    compressFile(file, base64 => {
                        ratingPhotosBase64.push(base64);
                        renderRatingPhotoPreview();
                    });
                });
                input.value = '';
            }
        }

        function renderRatingPhotoPreview() {
            const preview = document.getElementById('rating-photo-preview');
            preview.innerHTML = ratingPhotosBase64.map((img, idx) => `
                <div class="relative group">
                    <img src="${img}" onclick="openImageModal('${img}')" class="w-full h-16 object-cover rounded-lg border cursor-pointer">
                    <button onclick="removeRatingPhoto(${idx})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow z-10">✕</button>
                </div>
            `).join('');
        }

        function removeRatingPhoto(index) {
            ratingPhotosBase64.splice(index, 1);
            renderRatingPhotoPreview();
        }

        function handleCommentPhotos(id, input) {
            if (input.files && input.files.length > 0) {
                if (!commentPhotosMap[id]) commentPhotosMap[id] = [];
                Array.from(input.files).forEach(file => {
                    compressFile(file, base64 => {
                        commentPhotosMap[id].push(base64);
                        renderCommentPhotoPreview(id);
                    });
                });
                input.value = '';
            }
        }

        function renderCommentPhotoPreview(id) {
            const preview = document.getElementById(`comment-preview-${id}`);
            if(!preview || !commentPhotosMap[id]) return;
            preview.innerHTML = commentPhotosMap[id].map((img, idx) => `
                <div class="relative inline-block">
                    <img src="${img}" onclick="openImageModal('${img}')" class="w-12 h-12 object-cover rounded border cursor-pointer">
                    <button onclick="removeCommentPhoto('${id}', ${idx})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-bold shadow">✕</button>
                </div>
            `).join('');
        }

        function removeCommentPhoto(id, idx) {
            if (commentPhotosMap[id]) {
                commentPhotosMap[id].splice(idx, 1);
                renderCommentPhotoPreview(id);
            }
        }

        async function submitRating() {
            const btn = document.getElementById('rating-submit-btn');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.innerText = '相片上傳至 ImgBB 中...';

            const item = restaurantsData.find(i => i.id === currentRatingRestId);
            const score = parseFloat(document.getElementById('rating-score').value);
            const comment = document.getElementById('rating-comment').value;

            try {
                let uploadedUrls = [];
                for (let b64 of ratingPhotosBase64) {
                    const url = await uploadBase64ToImgBB(b64);
                    if (url) uploadedUrls.push(url);
                }

                btn.innerText = '儲存評分至雲端...';

                const payload = {
                    action: 'updateRestaurantWithPhotos',
                    id: currentRatingRestId,
                    status: '已試過',
                    new_rating: { 
                        id: 'RATE_' + new Date().getTime(),
                        user: currentUser, 
                        rating: score, 
                        comment: comment, 
                        time: new Date().toLocaleString() 
                    },
                    photos: uploadedUrls
                };

                const res = await postForm(payload);
                if(res.status === 'success') {
                    alert('評分與相片已成功儲存！');
                    document.getElementById('rating-modal').classList.add('hidden');
                    loadData();
                } else {
                    alert('提交失敗：' + res.message);
                }
            } catch (err) {
                console.error(err);
                alert('上傳失敗，請重試：' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '提交評分';
            }
        }

        async function postComment(id) {
            const textInput = document.getElementById(`comment-input-${id}`);
            const btn = document.getElementById(`comment-btn-${id}`);
            const text = textInput.value.trim();
            const b64Photos = commentPhotosMap[id] || [];

            if(!text && b64Photos.length === 0) return;

            btn.disabled = true;
            btn.innerText = '發布中...';

            try {
                let uploadedUrls = [];
                for (let b64 of b64Photos) {
                    const url = await uploadBase64ToImgBB(b64);
                    if (url) uploadedUrls.push(url);
                }

                const payload = {
                    action: 'addCommentWithPhotos',
                    id: id,
                    user: currentUser,
                    text: text,
                    photos: uploadedUrls
                };

                const res = await postForm(payload);
                if(res.status === 'success') {
                    textInput.value = '';
                    commentPhotosMap[id] = [];
                    renderCommentPhotoPreview(id);
                    loadData();
                } else {
                    alert('發布失敗：' + res.message);
                }
            } catch(e) {
                console.error(e);
                alert('發布失敗：' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '發布';
            }
        }

        function editCommentPrompt(restId, commentId, oldText) {
            const newText = prompt('請輸入修改後的留言內容：', oldText);
            if (newText === null || newText.trim() === '') return;
            postForm({ action: 'editComment', restId: restId, commentId: commentId, newText: newText.trim() }).then(res => {
                if(res.status === 'success') {
                    alert('已成功修改留言！');
                    loadData();
                } else { alert('修改失敗：' + res.message); }
            });
        }

        function editRatingPrompt(restId, ratingId, oldScore, oldComment) {
            const newScoreStr = prompt('請輸入修訂後的星級評分 (0.5 - 5.0)：', oldScore);
            if (newScoreStr === null) return;
            const newScore = parseFloat(newScoreStr);
            if (isNaN(newScore) || newScore < 0.5 || newScore > 5.0) { alert('請輸入有效星級！'); return; }

            const newComment = prompt('請輸入修訂後的短評：', oldComment);
            if (newComment === null) return;

            postForm({ action: 'editRating', restId: restId, ratingId: ratingId, newRating: newScore, newComment: newComment.trim() }).then(res => {
                if(res.status === 'success') {
                    alert('已成功修改評分！');
                    document.getElementById('history-modal').classList.add('hidden');
                    loadData();
                } else { alert('修改失敗：' + res.message); }
            });
        }

        function deleteComment(restId, commentId) {
            if(!confirm('確定要刪除這條留言嗎？')) return;
            postForm({ action: 'deleteComment', restId: restId, commentId: commentId }).then(res => {
                if(res.status === 'success') {
                    alert('D已成功刪除留言！');
                    loadData();
                } else { alert('刪除失敗：' + res.message); }
            });
        }

        function deleteRating(restId, ratingId) {
            if(!confirm('確定要刪除這次評分記錄嗎？')) return;
            postForm({ action: 'deleteRating', restId: restId, ratingId: ratingId }).then(res => {
                if(res.status === 'success') {
                    alert('已成功刪除評分！');
                    document.getElementById('history-modal').classList.add('hidden');
                    loadData();
                } else { alert('刪除失敗：' + res.message); }
            });
        }

        function deleteRestaurant(id) {
            if(!confirm('確定要永久刪除這間餐廳嗎？')) return;
            postForm({ action: 'deleteRestaurant', id: id }).then(() => { alert('已成功刪除'); loadData(); });
        }

        function triggerLottery() {
            const pending = restaurantsData.filter(i => i.status === '待試');
            if(pending.length === 0) { alert('暫無待試餐廳！'); return; }
            const pick = pending[Math.floor(Math.random() * pending.length)];
            
            document.getElementById('lottery-result').innerHTML = `
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 text-amber-900 space-y-2">
                    <div class="font-bold text-lg text-amber-800">${toTraditional(pick.name)}</div>
                    <div>📍 <b>地址：</b>${toTraditional(pick.address) || '無'}</div>
                    <div>🏙️ <b>城市/區域：</b>${toTraditional(pick.city)} · ${toTraditional(pick.district) || '未分類'}</div>
                    <div>🍲 <b>菜式種類：</b>${toTraditional(pick.type) || '未填'}</div>
                    ${pick.specialty ? `<div>🔥 <b>招牌推介：</b>${toTraditional(pick.specialty)}</div>` : ''}
                    <div>🕒 <b>營業時間：</b>${pick.hours || '未明'}</div>
                    <div>📞 <b>聯絡電話：</b>${pick.phone || '無'}</div>
                </div>
            `;
            document.getElementById('lottery-modal').classList.add('hidden');
        }

        function initAmap() {
            if (!window.amapObj) {
                window.amapObj = new AMap.Map('map', { zoom: 13, center: [113.543, 22.198] });
            }
            window.amapObj.clearMap();
            restaurantsData.forEach(item => {
                if (item.lng && item.lat) {
                    var marker = new AMap.Marker({ position: [parseFloat(item.lng), parseFloat(item.lat)], title: toTraditional(item.name) });
                    marker.on('click', function() {
                        var infoWindow = new AMap.InfoWindow({
                            content: `<div style="padding:5px;"><b>${toTraditional(item.name)}</b><br>${toTraditional(item.address) || ''}<br><a href="https://uri.amap.com/marker?position=${item.lng},${item.lat}&name=${encodeURIComponent(item.name)}&coordinate=gaode" target="_blank" style="color:#2563eb;">高德導航</a></div>`,
                            offset: new AMap.Pixel(0, -30)
                        });
                        infoWindow.open(window.amapObj, marker.getPosition());
                    });
                    window.amapObj.add(marker);
                }
            });
        }
    </script>
</body>
</html>
