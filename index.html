<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>為食兵團供應商名錄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 400px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- 登入頁面 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-6">
            <div class="text-center">
                <span class="text-4xl">🛡️</span>
                <h2 class="text-2xl font-bold mt-2 text-slate-900">為食兵團供應商名錄</h2>
                <p class="text-sm text-slate-500 mt-1">請選擇您的兵團身份登入</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">選擇帳戶</label>
                    <select id="login-user" class="mt-1 block w-full rounded-lg border border-slate-300 p-2.5 bg-slate-50">
                        <option value="Donald">總司令 (Donald)</option>
                        <option value="Agnes">團長 (Agnes)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">安全 PIN 碼</label>
                    <input type="password" id="login-pin" placeholder="請輸入 4 位數 PIN 碼" class="mt-1 block w-full rounded-lg border border-slate-300 p-2.5 bg-slate-50">
                </div>
                <button onclick="handleLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    進入兵團基地
                </button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden">帳號或 PIN 碼錯誤</p>
            </div>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div id="app-container" class="max-w-4xl mx-auto p-4 pb-24 hidden">
        <!-- 頂部導航列 -->
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-100">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span>🛡️</span> 為食兵團供應商名錄
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">當前身份：<span id="current-role-badge" class="font-semibold text-amber-600"></span></p>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition">
                切換身份
            </button>
        </header>

        <!-- 功能標籤切換 -->
        <div class="flex bg-slate-200/70 p-1 rounded-xl mb-6">
            <button onclick="switchTab('list')" id="tab-list-btn" class="flex-1 py-2 rounded-lg text-sm font-medium transition bg-white text-slate-900 shadow-sm">📋 餐廳清單</button>
            <button onclick="switchTab('add')" id="tab-add-btn" class="flex-1 py-2 rounded-lg text-sm font-medium transition text-slate-600">➕ 新增餐廳</button>
            <button onclick="switchTab('map')" id="tab-map-btn" class="flex-1 py-2 rounded-lg text-sm font-medium transition text-slate-600">🗺️ 美食地圖</button>
        </div>

        <!-- 1. 餐廳清單區 -->
        <div id="section-list" class="space-y-4">
            <!-- 篩選與抽籤工具列 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <select id="filter-city" onchange="renderList()" class="rounded-lg border border-slate-200 p-2 text-sm bg-slate-50">
                        <option value="">全部城市</option>
                        <option value="澳門">澳門</option>
                        <option value="珠海">珠海</option>
                    </select>
                    <select id="filter-status" onchange="renderList()" class="rounded-lg border border-slate-200 p-2 text-sm bg-slate-50">
                        <option value="">全部狀態</option>
                        <option value="待試">⏳ 待試名單</option>
                        <option value="已試過">✨ 已試過</option>
                    </select>
                    <input type="text" id="filter-keyword" oninput="renderList()" placeholder="搜尋餐廳/種類..." class="rounded-lg border border-slate-200 p-2 text-sm bg-slate-50">
                    <button onclick="triggerLottery()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-sm font-medium rounded-lg py-2 shadow-sm transition flex items-center justify-center gap-1">
                        <span>🎰</span> 今日盲盒抽籤
                    </button>
                </div>
            </div>

            <!-- 清單容器 -->
            <div id="restaurant-cards" class="space-y-4">
                <!-- 動態載入卡片 -->
            </div>
        </div>

        <!-- 2. 資料輸入區 -->
        <div id="section-add" class="bg-white p-6 rounded-2
